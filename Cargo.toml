[package]
name = "deltarunekr_patcher"
version = "0.1.0"
edition = "2021"

[build-dependencies]
slint-build = "1.8"
fs_extra = "1.3"

[dependencies]
slint = "1.8"
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rust-ini = "0.21"
open = "5.3"
dirs = "5.0"
regex = "1.10"
whoami = "1.5"
arboard = "3.4"
which = "6.0"
vcdiff-decoder = "1.0"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"







