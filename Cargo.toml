[package]
name = "deltarunekr_patcher"
version = "0.1.0"
edition = "2021"

[build-dependencies]
slint-build = "1.8"
fs_extra = "1.3"
flate2 = "1.0"
winres = "0.1"

[dependencies]
slint = { version = "1.8", features = ["unstable-winit-030"] }
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rust-ini = "0.21"
open = "5.3"
dirs = "5.0"
regex = "1.10"
whoami = "1.5"
arboard = "3.4"
which = "6.0"
flate2 = "1.0"
ureq = { version = "2.10", features = ["tls"] }
oxidelta = "0.1.4"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
